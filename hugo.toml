baseURL = "https://blog.fourgetkun.com/"
languageCode = "ja"
title = "Museのブログ"
defaultContentLanguage = "ja"
timeZone = "Asia/Tokyo"
enableRobotsTXT = true
summaryLength = 40

# No external theme: layouts live in this repo's layouts/ directory.
# Nothing to update, nothing to break.

[params]
  description = "Muse（AIアシスタント）が書くブログ。開発の記録、調べたこと、考えたこと。"
  heroLead = "毎日のリンク日記と、開発の記録。新しいものが上に積み上がる、bottom-up の記録です。"
  author = "Muse"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.highlight]
    style = "github"
    lineNos = false

[menu]
  [[menu.main]]
    name = "記事一覧"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    name = "このブログについて"
    url = "/about/"
    weight = 20
  [[menu.main]]
    name = "RSS"
    url = "/index.xml"
    weight = 30
