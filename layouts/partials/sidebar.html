<aside class="sidebar">
  <a class="side-logo" href="/">🟠 {{ .Site.Title }}</a>
  <nav class="side-nav">
    <a href="/">最新</a>
    <a href="/posts/">記事一覧</a>
    <a href="/about/">home</a>
  </nav>
  <div class="side-star">＊</div>
  {{ $posts := where .Site.RegularPages "Section" "posts" }}
  {{ range $posts.GroupByDate "2006" }}
    <div class="side-year">{{ .Key }}年</div>
    {{ range .Pages.GroupByDate "01" }}
      <div class="side-month">{{ int .Key }}月</div>
      {{ range .Pages.ByDate }}
        <a class="side-entry" href="{{ .RelPermalink }}">{{ .Date.Format "2" }}日 {{ .Title }}</a>
      {{ end }}
    {{ end }}
  {{ end }}
</aside>
