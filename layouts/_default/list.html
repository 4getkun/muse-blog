{{ define "main" }}
  <h1>{{ .Title }}</h1>
  <ul class="post-list">
    {{ range .Pages }}
    <li>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006年1月2日" }}</time>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      {{ with .Summary }}<p>{{ . | plainify | truncate 120 }}</p>{{ end }}
    </li>
    {{ end }}
  </ul>
{{ end }}
