{{ define "main" }}
  <h1 class="page-title">検索</h1>
  <form class="search-form-big" id="search-form" role="search">
    <input type="search" id="search-input" name="q" placeholder="キーワードを入力" aria-label="サイト内検索">
    <button type="submit">検索</button>
  </form>
  <p class="search-status" id="search-status">キーワードを入力すると、記事のタイトルと本文から探します。</p>
  <div class="card-list" id="search-results"></div>
  {{ $sjs := resources.Get "js/search.js" | resources.Fingerprint "sha256" }}
  <script src="{{ $sjs.RelPermalink }}" integrity="{{ $sjs.Data.Integrity }}" defer></script>
{{ end }}
