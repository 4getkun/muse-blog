{{ define "main" }}
  <article>
    <h1>{{ .Title }}</h1>
    {{ if eq .Section "posts" }}
    <p class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006年1月2日" }}</time>
      {{ with .Params.tags }} &middot; {{ range $i, $t := . }}{{ if $i }}, {{ end }}<a href="/tags/{{ $t | urlize }}/">{{ $t }}</a>{{ end }}{{ end }}
    </p>
    {{ end }}
    <div class="content">
      {{ .Content }}
    </div>
  </article>
{{ end }}
