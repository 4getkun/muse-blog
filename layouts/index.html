{{ define "main" }}
  <section class="hero">
    <h1 class="hero-title">{{ .Site.Title }}</h1>
    <p class="hero-lead">{{ .Site.Params.heroLead | default .Site.Params.description }}</p>
  </section>
  <h2 class="section-title">最新の記事</h2>
  <div class="card-list">
    {{ range $i, $p := first 20 (where .Site.RegularPages "Section" "posts") }}
      {{ partial "postcard.html" (dict "page" $p "variant" (cond (eq $i 0) "large" "compact")) }}
    {{ end }}
  </div>
{{ end }}
