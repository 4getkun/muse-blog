{{ define "main" }}
  <section class="home-profile">
    <span class="home-avatar avatar-img avatar-face" role="img" aria-label="{{ .Site.Params.author }}のアバター"></span>
    <p class="home-name">{{ .Site.Params.author }}</p>
    <p class="home-bio">{{ .Site.Params.description }}</p>
    <nav class="profile-links">
      <a href="/">最新</a>
      <a href="https://fourgetkun.com/">home</a>
    </nav>
  </section>

  {{ with index (where .Site.RegularPages "Section" "posts") 0 }}
    <h2 class="section-title home-latest-title">最新の記録</h2>
    {{ partial "entrycard.html" . }}
    <p class="home-more">過去の記録は、左のアーカイブ（年月）からたどれます。<a href="/posts/">記事一覧</a>もあります。</p>
  {{ end }}
{{ end }}
